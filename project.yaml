    - triggers/*
    - chains/*
    - operator/*
    - results/*
    - pruner/*
    - pipelines-as-code/*
    - catalog/*
  homebrew: "tektoncd-cli"
  chocolatey: "tektoncd-cli"

social:
  twitter: "https://twitter.com/tektoncd"

security:
  policy:
    path: "https://github.com/tektoncd/.github/blob/main/SECURITY.md"
  contact:
