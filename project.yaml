schema_version: "1.0.0"
slug: "tekton"
name: "Tekton"
description: "A powerful and flexible open source framework for creating continuous integration and delivery (CI/CD) systems that allow developers to build, test, and deploy across multiple cloud providers and on-premises systems by abstracting away the underlying implementation details."
type: "project"
project_lead: tektoncd/governing-board
slack_channels:
