    path: "https://github.com/tektoncd/.github/blob/main/LICENSE"
  identity_type:
    has_dco: true
    has_cla: true
    cla_only: true
    cla_url:
      path: https://easycla.lfx.linuxfoundation.org/#/?version=2

documentation:
  readme:
    path: "https://tekton.dev/docs"

landscape:
  category: "App Definition and Development"
  subcategory: "Continuous Integration & Delivery"

