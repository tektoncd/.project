    workspace: "tekton"
    link: "https://join.slack.com/t/tektoncd/shared_invite/zt-1z8ctzsyv-wLXWwA2Rl3AOhcNGqpWRUw"
    primary: true

maturity_log:
  - phase: "incubating"
    date: "2026-07-10T16:20:26Z"
    issue: "https://github.com/cncf/toc/issues/2088"

repositories:
  - "https://github.com/tektoncd/pipeline"
  - "https://github.com/tektoncd/triggers"
  - "https://github.com/tektoncd/chains"
  - "https://github.com/tektoncd/results"
  - "https://github.com/tektoncd/cli"
  - "https://github.com/tektoncd/dashboard"
  - "https://github.com/tektoncd/operator"
  - "https://github.com/tektoncd/catalog"
  - "https://github.com/tektoncd/pipelines-as-code"
  - "https://github.com/tektoncd/pruner"
